name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -p no:warnings
      - name: CLI smoke test
        run: |
          mini-ids info
          mini-ids gen-pcap captures/ci.pcap --scenarios portscan,web_attacks --warmup 5 --gap 5
          mini-ids replay captures/ci.pcap --config config/demo.yaml --no-web -q
